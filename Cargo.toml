[workspace]

[package]
name = "nemotron3-diarization-wgpu"
version = "0.1.0"
edition = "2021"
description = "NVIDIA Nemotron 3 Diarization on wgpu — a bit-accurate Rust port of the official transformers implementation"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "nemotron3_diarization_wgpu"
path = "src/lib.rs"

[[bin]]
name = "spike"
path = "src/main.rs"

[[bin]]
name = "front_end_check"
path = "src/bin/front_end_check.rs"

[dependencies]
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
anyhow = "1"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
rustfft = "6"
gemm = "0.18"
rayon = "1.10"
libm = "0.2"
thiserror = "2"
# only front_end_check uses this, to read the Python baseline's .npz front-end dumps
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = false
